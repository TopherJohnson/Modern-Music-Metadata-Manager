services:
  m4:
    build:
      context: .
      dockerfile: Dockerfile
    image: modern-music-metadata-manager:latest
    container_name: m4-metadata-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Replace `/path/to/music` with the exact host music directory mounted into Navidrome (read-write)
      - /path/to/music:/music
      # Persistent lightweight SQLite cache, settings, and edit audit history
      - ./config:/config
    environment:
      # Match the UID/GID used by Navidrome so edited audio files retain expected ownership
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # Optional: trigger a Navidrome Subsonic `startScan` automatically after saving tags
      # - NAVIDROME_URL=http://navidrome:4533
      # - NAVIDROME_USER=admin
      # - NAVIDROME_PASS=your-password
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; r = urllib.request.urlopen('http://localhost:8080/api/health', timeout=4); sys.exit(0 if r.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
